    <link rel="canonical" href="https://limestonecitybitcoin.com/debt-clock/" />
    <meta http-equiv="refresh" content="0; url=https://limestonecitybitcoin.com/debt-clock/" />

    <script>
      // Drop the old offline copy, then forward to the clock's new home.
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
      }
      location.replace("https://limestonecitybitcoin.com/debt-clock/");
    </script>
